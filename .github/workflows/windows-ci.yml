name: ImageForge 3D - Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and extract Windows package
        shell: pwsh
        run: |
          $files = @(
            "release-parts/part01.b64",
            "release-parts/part01-tail.b64",
            "release-parts/part02.b64",
            "release-parts/part03.b64",
            "release-parts/part04.b64",
            "release-parts/part05.b64",
            "release-parts/part06.b64"
          )
          $encoded = ($files | ForEach-Object {
            (Get-Content -Raw -LiteralPath $_).Trim()
          }) -join ""
          if (($encoded.Length % 4) -ne 0) {
            throw "Base64 package length is not divisible by 4."
          }
          $archive = Join-Path $env:RUNNER_TEMP "ImageForge3D-v0.1.3-Windows.zip"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          $packageRoot = Join-Path $env:RUNNER_TEMP "imageforge3d-package"
          Expand-Archive -LiteralPath $archive -DestinationPath $packageRoot -Force
          $project = Join-Path $packageRoot "imageforge3d"
          if (!(Test-Path (Join-Path $project "app.py"))) {
            throw "The archive does not contain imageforge3d/app.py."
          }
          "IMAGEFORGE_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IMAGEFORGE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: release-parts/README.md

      - name: Install pinned UI dependencies
        shell: pwsh
        run: |
          Set-Location $env:IMAGEFORGE_PROJECT
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ui.txt
          python patch_gradio_client.py
          python -m pip check

      - name: Compile project and smoke-test the real Gradio app
        shell: pwsh
        env:
          IMAGEFORGE_OPEN_BROWSER: "0"
          IMAGEFORGE_SERVER_NAME: "127.0.0.1"
          IMAGEFORGE_SERVER_PORT: "7861"
          GRADIO_ANALYTICS_ENABLED: "False"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          Set-Location $env:IMAGEFORGE_PROJECT
          python -m compileall -q app.py patch_gradio_client.py repair_triposr_mesh.py tests
          python tests/smoke_test.py

      - name: Upload tested Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ImageForge3D-v0.1.3-Windows
          path: ${{ runner.temp }}\ImageForge3D-v0.1.3-Windows.zip
          if-no-files-found: error
          retention-days: 14
